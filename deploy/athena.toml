# ─────────────────────────────────────────────────────────────────────
#  Athena daemon configuration
# ─────────────────────────────────────────────────────────────────────
#
#  Parsed by `athena install` (→ launchd plist) and editable in place
#  with `athena config set <key> <value>`.
#
#  Schema: flat `key = value` scalars only — no tables or arrays. Lines
#  starting with `#` are comments; a commented key falls back to the
#  daemon's built-in default. Strings are quoted; ints are bare.
#
# ─────────────────────────────────────────────────────────────────────


# ── Network ──────────────────────────────────────────────────────────

# Address the HTTP surface binds to. 127.0.0.1 keeps Athena loopback-
# only (passive-oracle default); set 0.0.0.0 to serve the LAN.
listen_host = "127.0.0.1"

# Athena's own port (7447), distinct from Ollama's 11434.
listen_port = 7447


# ── Memory governor ──────────────────────────────────────────────────

# Global Metal/MLX memory budget, in bytes. Commented ⇒ the governor
# defaults to 75% of physical unified memory. Example: 36 GB.
# budget_bytes = 36000000000


# ── Model ────────────────────────────────────────────────────────────

# LLM engine: "mlx" (a real model from the store — Qwen3.5 plus other
# substrate architectures: Llama, Gemma, Mistral, Phi, Qwen2/3, …) or
# "stub" (no model loaded — health/dev only).
engine = "mlx"

# Model directory path, or a name resolved under the model-store root.
# Commented ⇒ the built-in default (Qwen3.5-27B-4bit-mtp, MTP weights
# preserved). Any architecture the substrate factory supports works
# here; `athena show <model>` reports its type + capability tier.
# model = "Qwen3.5-27B-4bit-mtp"

# Model-store ROOT directory (where model dirs / an optional sibling
# hf-cache live). Commented ⇒ the built-in default
# "~/.athena/models" (boot volume, no external disk assumed). Set
# this to relocate the store, e.g. onto an external SSD.
# model_store = "/Volumes/SB-XTM5/mlx-models"


# ── Inference tuning ─────────────────────────────────────────────────
# All optional; commented ⇒ the built-in default shown.

# Max generated tokens per request (default 1024).
# max_tokens = 1024

# Sampling temperature; 0 = deterministic greedy (default 0.7).
# Bare number, not quoted.
# temperature = 0.7

# MTP speculative decoding — greedy/temp-0 + Qwen3.5(-MTP) only; a no-op
# on other architectures (default false). Bare boolean.
# speculative = false

# KV-cache compression (default "none"): "none", "turboquant"
# (TurboQuant quantized KV cache — applies to ANY architecture), or
# "triattention" (norm-only TriAttention token eviction — caps the cache
# by dropping low-importance decode tokens; Qwen3.5-only, inert on other
# architectures and on the MTP/speculative path).
# The ATHENA_KV_COMPRESSION env var overrides this. An unrecognized value
# is a hard startup error; a valid-but-inert codec (e.g. triattention on
# a non-Qwen model) warns and runs uncompressed.
# kv_compression = "none"

# Built-in vector-store byte cap (default: memory budget / 8).
# vector_cap_bytes = 4294967296


# ── Storage ──────────────────────────────────────────────────────────

# Directory for the embedded SQLite store (vector DB + async queue +
# job rows). Commented ⇒ "~/.athena" of the daemon's user. Set this to
# a stable, backed-up path for any real deployment.
# data_dir = "/usr/local/var/athena/data"


# ── Security ─────────────────────────────────────────────────────────

# Bearer-token auth keys file. Each line: `admin <key>` or
# `inference <key>` (# comments ok). Keep it chmod 600. Keys may
# also come from ATHENA_ADMIN_KEYS / ATHENA_INFERENCE_KEYS env
# (comma-separated). Commented + loopback bind ⇒ auth OFF (dev).
# Commented + non-loopback bind ⇒ the daemon REFUSES to start.
# Any keys present ⇒ enforced. admin ⊇ inference; admin also gates
# the WebUI, /metrics, /v1/store, and mutating queue/vector ops.
# auth_keys_file = "/usr/local/etc/athena/auth.keys"
# Generate keys with `athena auth add admin|inference` — the raw
# key is shown ONCE and only its sha256:<hex> is written here (no
# secret at rest). Raw `tier <key>` lines are still accepted.

# In-daemon TLS (HTTPS). Point both keys at PEM files: tls_cert is the
# certificate chain (leaf first, then any intermediates), tls_key the
# matching private key. BOTH must be set together — setting only one is
# a hard startup error. Commented ⇒ plaintext HTTP, in which case
# bearer tokens and the WebUI cookie are only safe on a loopback bind
# or behind a TLS reverse proxy (see docs/reverse-proxy.md). Keep the
# private key chmod 600 and owned by the daemon user; `athena doctor`
# reports cert/key posture (existence, expiry, key perms).
# tls_cert = "/usr/local/etc/athena/tls/fullchain.pem"
# tls_key  = "/usr/local/etc/athena/tls/privkey.pem"

# Inbound rate limiting (per principal). rate_limit is the sustained
# requests/sec each caller (user — shared across that user's tokens) may
# make; rate_burst is the token-bucket capacity (the largest momentary
# burst above the sustained rate). Over the limit ⇒ HTTP 429 with a
# Retry-After header. Composes with — but is distinct from — the
# governor's memory 503. Commented / non-positive ⇒ DISABLED (default).
# Only enforced when auth is enabled; an auth-off loopback dev bind is
# never throttled. Health checks, /metrics, and the WebUI are exempt.
# If rate_burst is omitted it defaults to one second's worth of rate.
# rate_limit = 10        # 10 req/s sustained per principal
# rate_burst = 20        # allow a 20-request burst

# Inbound concurrency caps — bound how many requests may be IN FLIGHT at
# once (orthogonal to the rate limit, which bounds requests over time).
# max_concurrency caps the whole daemon; max_concurrency_per_principal
# caps any single caller. Over a cap ⇒ HTTP 429 with code
# concurrency_limit + Retry-After. Distinct from the governor's memory
# 503 (this admits by count, not bytes). Commented / non-positive ⇒
# UNLIMITED (default). Only enforced when auth is enabled. Health checks,
# /metrics, and the WebUI are exempt.
# max_concurrency = 8                  # daemon-wide in-flight cap
# max_concurrency_per_principal = 2    # per-caller in-flight cap

# Audit-log retention. Every RBAC/admin mutation (user/role/token CRUD,
# model removal, default-model change, daemon load/unload) is recorded
# to an append-only audit_log table (read it via `athena audit` or
# GET /api/audit). audit_retention_days bounds how long rows are kept —
# entries older than the window are pruned as the trail grows. Commented
# / non-positive ⇒ KEEP FOREVER (default; an audit trail should not
# silently auto-delete unless you ask it to).
# audit_retention_days = 365           # prune audit rows older than 1y


# ── Network (egress proxy) ───────────────────────────────────────────

# The ONLY outbound the appliance makes is fetching model weights
# from the Hugging Face Hub. In a locked-down network, route it
# through an egress proxy here. The standard env vars
# (HTTPS_PROXY / HTTP_PROXY / ALL_PROXY / NO_PROXY, case-insensitive)
# ALWAYS take precedence — these keys only fill in what the env
# leaves unset. Loopback (127.0.0.1, ::1, localhost) is always
# bypassed. Form: scheme://host:port (socks5:// also supported).
# https_proxy = "http://proxy.corp.example:3128"
# http_proxy  = "http://proxy.corp.example:3128"
# all_proxy   = "socks5://proxy.corp.example:1080"
# no_proxy    = "127.0.0.1,localhost,.internal.example"
# Proxy credentials are NOT stored here. Either embed them inline
# (https://user:pass@host:port) or — recommended, no secret at rest —
# run `athena proxy login` to keep them in the macOS Keychain (a
# Keychain credential overrides any inline one).


# ── Logging ──────────────────────────────────────────────────────────

# Directory for athena.out.log / athena.err.log (launchd-managed).
log_dir = "/usr/local/var/log/athena"

# Verbosity floor for stdout AND the macOS unified log
# (subsystem "athena"): trace|debug|info|notice|warning|error|
# critical. Commented ⇒ "info". "debug" (or "trace") = maximum.
# log_level = "info"

# Opt-in remote syslog sink (RFC5424 over UDP). This is the SINGLE
# sanctioned exception to the passive-oracle "no outbound" rule —
# LOGS ONLY, never inference data; default OFF (commented). Form:
# "udp://host[:514]". Same level floor as log_level applies.
# syslog_remote = "udp://10.0.0.5:514"
