# Athena structured-output shim — a thin C-ABI staticlib over
# `outlines-core` (JSON-schema/regex/choice → DFA `Index`) plus a ported
# Guide walker (the outlines-core Guide + 32-entry rollback ring lives
# only behind its pyo3 feature, so it is reimplemented here from the
# public `Index` primitives — NO pyo3, NO regex→DFA reimplementation).
#
# host == target == arm64 macOS, so a plain `cargo build --release` .a +
# a hand-written C header consumed by a SwiftPM target is sufficient
# (no xcframework / lipo needed). `lib` crate-type kept so `cargo test`
# can exercise the walker without FFI.
[package]
name = "athena-structured-shim"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "athena_structured_shim"
crate-type = ["staticlib", "lib"]

[dependencies]
outlines-core = { version = "0.2.14", default-features = false }

[profile.release]
opt-level = 3
