# Athena structured-output shim — a thin C-ABI staticlib over
# `llguidance` (guidance-ai), a lazy/incremental grammar-constrained
# decoding engine. It replaces the previous `outlines-core` full-DFA
# precompile (M53): outlines materialised the entire schema→regex→DFA
# over the full vocabulary before the first token, so a `maxItems`-bounded
# outer array over a large item subschema unrolled into a state×vocab
# cross-product (~150 GB of rust-shim heap on a 128 GB box). llguidance
# parses incrementally — bounded repetition is a counter in the parser,
# not unrolled states — so the same schema constructs in <0.3 s at <0.1 GB.
#
# Same C ABI as before (oc_vocab_* / oc_index_* / oc_guide_*) so the Swift
# `AthenaStructured` surface is unchanged; only the engine behind it moves.
#
# host == target == arm64 macOS, so a plain `cargo build --release` .a +
# the hand-written C header consumed by a SwiftPM target is sufficient.
# `lib` crate-type kept so `cargo test` can exercise the walker without FFI.
[package]
name = "athena-structured-shim"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "athena_structured_shim"
crate-type = ["staticlib", "lib"]

[dependencies]
llguidance = "1.7.5"
toktrie = "1.7.5"
serde_json = "1.0"

[profile.release]
opt-level = 3
