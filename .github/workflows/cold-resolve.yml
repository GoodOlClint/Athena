# Cold dependency resolve — the signal that a pinned revision is still
# fetchable from its remote (#90).
#
# Why this exists as its own workflow rather than a job in ci.yml: the whole
# point is to have NO cache and NO restored `.build`. The `unit` job caches
# `.build`, which carries SPM's bare mirrors under `repositories/` plus
# `checkouts/`; when the required revision is already in a restored mirror SPM
# never contacts the remote, so remote unreachability is unobservable. That is
# exactly why #86 sat green while every cold build failed — the pin `751aaed`
# had been orphaned by a force-push to the substrate's `integration` branch,
# and CI stayed green on cache warmth alone. It surfaced only when an unrelated
# compiler-fingerprint change (#85) rotated the cache prefix and forced the
# first genuinely cold resolve in a long time. The cold resolve that actually
# diagnosed #86 was run by hand, locally. This job is that run, on a schedule.
#
# What it would have caught, and still will: a pin whose object is no longer
# FETCHABLE — #86's orphaned commit, the fork being re-created, or
# `GoodOlClint/swift-huggingface` losing `athena/pr-50-download-progress`,
# whose branch tip is what the current `727df097` pin resolves through.
#
# Stated as reachability rather than as "a pruned tag" on purpose: deleting a
# dated tag whose commit is still reachable from another ref leaves the pin
# resolvable, and this job passes. That is the right answer — the object is
# still there — but it is a weaker guarantee than "the tags still exist".
#
# What it does NOT catch, so nobody reads more into a green run than it means:
# this job tests REACHABILITY, never pin FORM. A bare-hash pin that happens to
# be reachable passes forever — and one is live right now: `Package.swift`'s
# `hubDep` pins the 40-hex `727df097…`, which is the TIP of a branch, i.e.
# exactly the #86 shape, one force-push away from orphaned. This job would
# report that only AFTER the object was orphaned, which is the moment its own
# error text calls urgent. Enforcing the AGENTS.md dated-tag rule is a separate
# check nobody has written.
#
# Deliberately cheap so it can be routine: free Linux, resolve only. No
# compile, no Metal Toolchain download, no macOS minutes (which bill at 10x).
# Resolution is a manifest+remote operation — nothing here is platform-specific
# even though the daemon itself is macOS-only. Verified rather than assumed:
# a cold resolve of this exact graph inside this container image succeeds on
# Linux (~31s on arm64; ~38s measured on macOS), despite the root manifest
# being tools-version 6.1, declaring macOS-only `platforms:`, and passing
# `traits: []` to a substrate whose own manifest is 6.3.
name: Cold resolve

on:
  schedule:
    # Mondays 07:00 UTC. Weekly is the cadence the risk deserves: the failure
    # mode is a remote object going away, and the cost of noticing late is that
    # it may be GC-ed and unrecoverable — the deadline #86 itself names.
    - cron: '0 7 * * 1'
  workflow_dispatch:
  # Also on any change to the pins themselves, where a bad pin is most likely
  # to be introduced and where the feedback is worth having immediately.
  pull_request:
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/cold-resolve.yml'

concurrency:
  group: cold-resolve-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve pins with no cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The substrate ships a swift-tools-version 6.3 manifest (mlx-swift >=
    # 0.31.5), so the resolver must be able to PARSE it — an older Swift fails
    # resolution before reaching the network and would look like a pin failure.
    # Same container the lint job pins, for the same reason: an exact version,
    # bumped deliberately.
    container:
      image: swift:6.3.3-rhel-ubi9
    steps:
      - uses: actions/checkout@v6

      - name: Mark workspace safe for git-in-container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # No actions/cache step anywhere in this job, on purpose. Do not add one
      # "to speed it up" — a warm cache is precisely the masking mechanism this
      # job exists to defeat, and adding it would leave the workflow green and
      # meaningless.
      - name: Assert no restored build state
        run: |
          if [ -e .build ]; then
            echo "::error title=Cold resolve is not cold::.build exists before resolution, so SPM may serve the pins from a local mirror and never contact the remote. This job's entire signal depends on starting with no build state."
            exit 1
          fi
          echo "::notice title=Starting cold::no .build present"

      # No pipe, no `tee`, no captured status: SPM's own exit code is the whole
      # signal, and the job log already records its output. An earlier draft
      # piped through `tee` and read `PIPESTATUS` — which the command inside
      # the `if` body would have clobbered, making the job green on exactly the
      # failure it exists to catch. Keeping it a bare command removes the class.
      # `--cache-path` at a fresh per-run directory, so "cold" is a property of
      # the command rather than an assumption about the runner image. `.build`
      # being absent is not sufficient on its own: SPM also keeps a SHARED
      # dependency cache outside the workspace, and it will serve a pin from
      # there — measured locally, where a second resolve after `rm -rf .build`
      # reported "Fetched … from cache". An ephemeral container starts with no
      # such cache today; this flag means the signal does not depend on that
      # staying true. Measured cost of a genuine cold resolve: ~38s.
      - name: Resolve dependency graph
        run: |
          if ! swift package resolve --cache-path "$RUNNER_TEMP/spm-cold-cache"; then
            echo "::error title=A pinned revision is unreachable::swift package resolve failed from cold. A pin in Package.swift/Package.resolved cannot be fetched from its remote — most likely an orphaned commit (force-pushed branch), a pruned tag, or a deleted branch. Cached CI builds will keep passing until the cache rotates, so treat this as urgent: an unreferenced object can be garbage-collected and become unrecoverable. See AGENTS.md (pin an immutable integration-YYYY-MM-DD TAG) and docs/substrate-bump-runbook.md."
            exit 1
          fi
          echo "::notice title=All pins reachable::cold resolve succeeded"

      # A successful resolve is not the same as an accurate lockfile. SPM
      # REGENERATES an out-of-date Package.resolved and exits 0, so a PR that
      # edits Package.swift without committing the regenerated lockfile would
      # get a green "All pins reachable" here — and the summary step below would
      # print pins the repository does not actually contain, defeating its
      # stated purpose as a last-known-good record. Assert the resolve was a
      # no-op against what is committed.
      - name: Assert Package.resolved is what the resolve produced
        run: |
          if ! git diff --exit-code -- Package.resolved; then
            echo "::error title=Package.resolved is out of date::The cold resolve REGENERATED the lockfile, so what is committed does not match what Package.swift resolves to. Commit the regenerated Package.resolved. Until then the pins recorded in this repo are not the pins a build gets."
            exit 1
          fi
          echo "::notice title=Lockfile accurate::Package.resolved matches the resolved graph"

      # Report what actually resolved, so a run that goes red later has a
      # last-known-good record in its predecessor's log. Trustworthy only
      # because the step above proved this is the committed lockfile.
      - name: Record resolved revisions
        run: |
          if [ -f Package.resolved ]; then
            echo "### Resolved pins" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat Package.resolved >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  # A red SCHEDULED run is attached to no PR, so nothing surfaces it but
  # GitHub's default email to the last committer — and this job's entire value
  # is noticing BEFORE an unreferenced object is garbage-collected. File an
  # issue instead. PR runs need none of this: there the red check sits on the
  # PR, which is why this is gated to `schedule`.
  #
  # A SEPARATE job, not a step in `resolve`, for one practical reason: `resolve`
  # runs inside the Swift container, which has no `gh`. The hosted runner image
  # does. It also keeps `issues: write` off the job that resolves untrusted
  # dependency manifests.
  #
  # Known gap, not worth machinery: GitHub disables scheduled workflows after
  # 60 days of repository inactivity, and a disabled workflow files nothing.
  notify:
    name: File an issue on a failed scheduled run
    needs: resolve
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Cold resolve failed: a pinned revision is unreachable'
          # Deduped by exact title so a persistent failure does not open one
          # issue per week; a still-failing run leaves a dated comment instead.
          existing=$(gh issue list --repo "$REPO" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Still failing — $RUN_URL"
            echo "::notice title=Existing issue updated::#$existing"
            exit 0
          fi
          gh issue create --repo "$REPO" --title "$title" --label bug --body \
          "The weekly cold resolve failed: a revision pinned in \`Package.swift\` / \`Package.resolved\` could not be fetched from its remote.

          Run: $RUN_URL

          **Why this is urgent.** Cached CI builds keep passing — that is the whole reason this job exists (#86, where an orphaned pin stayed invisible for months). An unreferenced object can be garbage-collected and become permanently unrecoverable, so the window to recover it by tagging the orphan is finite.

          **Where to start:** the failing step's log names the pin. See AGENTS.md (pin an immutable \`integration-YYYY-MM-DD\` tag, never a bare hash or a branch) and \`docs/substrate-bump-runbook.md\`.

          Filed automatically by \`.github/workflows/cold-resolve.yml\`."
