name: Claude Code

# On-demand Claude actions via @claude mentions in issues/PRs/comments.
# Common uses:
#   - `@claude write this as an issue` — turn a PR comment thread into a
#     properly-formatted issue
#   - `@claude re-review` — re-run the PR review after changes
#   - `@claude explain why <X>` — ask for an explanation anchored to the
#     current diff / issue context
# The review workflow (claude-code-review.yml) handles automatic PR review.
# This workflow handles the interactive case.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            You were mentioned with @claude in a comment on this repo
            (Athena — a native macOS/MLX inference daemon; passive oracle,
            single governed Metal memory budget; see CLAUDE.md). Figure
            out what the user is asking for from the comment body and
            execute it.

            Common asks and how to handle them:

            ## "Write this as an issue" / "turn this into an issue"

            Read the parent comment / review / PR description for
            context. Synthesize a GitHub issue:

            ```
            Title: <short imperative description>

            Body:
            ## What to fix
            <describe the gap — what's missing or wrong>

            ## Why it matters
            <impact>

            ## Acceptance criteria
            <how to verify the fix worked>

            ## Out of scope
            <anything that should NOT be done as part of this>

            ---
            Created from <PR/issue link> at @<user>'s request.
            ```

            Label with `bug` or `enhancement` as appropriate (stock
            label set). Reply on the original thread with the new issue
            number.

            ## "Re-review"

            Tell the user re-review runs automatically on the next push;
            if they want one without pushing, they can re-run the
            claude-review workflow from the Actions tab. If you were
            asked because the review workflow skipped (e.g. the PR edits
            .github/workflows/), say so and add GoodOlClint as reviewer.

            ## "Explain <X>"

            Answer anchored to the actual diff/code/ADRs — cite files
            and docs/decisions/ records. Athena's architecture rules live
            in CLAUDE.md and docs/decisions/; prefer citing those over
            general reasoning.

            ## Anything that would change code or repo settings

            You may push commits ONLY to the PR branch you were invoked
            from, and only for what was explicitly asked (e.g. "fix the
            typo you flagged"). Never push to main, never change
            workflows, branch protection, or settings. For anything
            architectural, defer to @GoodOlClint.

          claude_args: |
            --model claude-opus-5
