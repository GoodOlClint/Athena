# PR CI — the unit test tier. Runs on PRs, plus pushes to main (cache seeding —
# see the `seed` job); the full Release build + heavy model-gated e2e stay
# manual (real models + hardware).
#
# The MLX Metal shaders need the Metal Toolchain, which requires Xcode 26+ — the
# hosted runner's DEFAULT Xcode is too old, so we select the newest installed
# Xcode explicitly (validated on macos-15 during the 2026-07 soak; moved to
# macos-26 for #93 — mlx-swift >= 0.31.5 ships a swift-tools-version 6.3
# manifest, and macos-15's newest Xcode (26.3, Swift 6.2.4) cannot parse it,
# failing resolution before any build).
#
# Cost shape (macOS minutes bill at 10x): docs/process-only PRs skip lint+unit
# via the `changes` gate job — the jobs report "skipped", which satisfies
# required status checks. If branch protection is ever enabled, add
# "Classify diff" itself to the required checks: a FAILED gate job also skips
# lint/unit, and skipped required checks read as passing. Pushes to main run
# `seed` only: it exists solely to publish the SPM dependency cache to a
# main-scoped key (PR-created caches are invisible to sibling PRs), so it
# builds WITHOUT running tests — the PR head already passed the unit tier.
# (That is true up to a stale base: with several PRs in flight, the squashed
# tree on main can be a combination no CI run ever built. Accepted exposure —
# the next PR's CI surfaces it; enable "require branches up to date" to close
# it.) The seed exits in ~1 minute when the cache key already exists (no
# dep-pin or toolchain change).
name: CI

# PRs + main. A push trigger on PR BRANCHES alongside pull_request double-runs
# every PR head (different concurrency groups), burning macOS minutes — so
# branches without a PR get CI by opening one. The main push trigger is the
# exception, and it's load-bearing: GitHub scopes caches created on a PR to
# that PR, so only a cache saved from main is visible to every PR.
on:
  pull_request:
  push:
    branches: [main]

# PR pushes supersede each other (cancel-in-progress). Main pushes must NOT
# cancel each other: the seed run is now the ONLY producer of the shared SPM
# cache, and cancelling a post-dep-bump seed leaves every PR rebuilding deps
# until the next main push — so each main push gets a unique group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Docs-only gate: lint and unit run only when the PR touches code. "Code" =
  # anything OUTSIDE docs/, .claude/, and *.md — so workflow yml, Sources,
  # Tests, deploy, Package.* all count as code. Runs on cheap ubuntu.
  changes:
    name: Classify diff
    permissions:
      contents: read
      pull-requests: read   # size gate reads labels live
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # The pull_request checkout is the PR merge commit; parent 1 is the base
      # branch tip, so HEAD^1..HEAD is exactly what the PR introduces.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Detect code changes
        id: diff
        run: |
          files=$(git -c core.quotePath=false diff --name-only HEAD^1 HEAD)
          printf 'Changed files:\n%s\n' "$files"
          # Docs = anything under docs/ or .claude/, root-level *.md (README…),
          # or .github markdown (review prompts/guides). Deliberately NOT a
          # global '\.md$': a .md fixture under Tests/ is code. Empty diff
          # fails toward running CI.
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvE '^docs/|^\.claude/|^\.agents/|^\.codex/|^[^/]+\.md$|^\.github/.*\.md$'; then
            code=true
          else
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice title=Diff classification::code=$code"

  # Review-capacity ceiling. Defect detection collapses above ~400-450 reviewed
  # LOC/hour (Cisco/SmartBear, 2500 reviews / 3.2M LOC); that study's working
  # recommendation is 100-300 LOC per sitting. A solo operator has no second
  # reviewer to absorb overflow, so an oversized PR is skimmed, not reviewed.
  #
  # SEPARATE JOB on purpose: it lived inside `changes`, and lint/unit are
  # `needs: changes` with no `always()`, so a red size gate SKIPPED both tiers
  # -- and this file's own header records that skipped required checks read as
  # passing. An oversized PR got zero style/test signal. Now the tiers run
  # regardless and only this check goes red.
  size:
    name: PR size ceiling
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # reads labels live; see below
    env:
      # POSIX class, not `\t`: ERE does not define `\t`, two reviewers
      # disagreed about whether GNU grep accepts it, and the local shell shims
      # grep to ugrep (which does) -- so local testing proved nothing about the
      # runner. `[[:blank:]]` is unambiguous in GNU, BSD and ugrep. The
      # self-test step below pins it under THIS runner's grep, which is the
      # only check that would have caught the original bug.
      EXCLUDE_RE: '([[:blank:]]|/)(Package\.resolved|[^/]*\.lock|[^/]*\.pbxproj|[^/]*\.snap)$'
      LIMIT: '400'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Self-test the exclusion regex under this runner's grep
        run: |
          printf '320\t10\tPackage.resolved\n'        >  /tmp/fx
          printf '5\t5\tclients/Package.resolved\n'   >> /tmp/fx
          printf '9\t9\tSources/Mutex.lock.swift\n'   >> /tmp/fx
          printf '7\t3\tSources/A.swift\n'            >> /tmp/fx
          kept=$(grep -vE "$EXCLUDE_RE" /tmp/fx | awk 'NF{a+=$1;d+=$2} END{print a+d+0}')
          # Sources/Mutex.lock.swift (18) + Sources/A.swift (10) = 28.
          # Both Package.resolved entries -- root AND nested -- must be excluded.
          if [ "$kept" -ne 28 ]; then
            echo "::error title=Exclusion regex broken on this runner::expected 28 reviewable lines from the fixture, got $kept. The generated-file exclusions are not firing as intended; fix EXCLUDE_RE before trusting the gate."
            grep -vE "$EXCLUDE_RE" /tmp/fx
            exit 1
          fi
          echo "::notice title=Exclusion regex verified::fixture yields $kept reviewable lines as expected"

      - name: Measure reviewable churn
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Labels read LIVE, not from the event payload: `pull_request:` uses
          # GitHub's default activity types, which exclude `labeled`, so a label
          # added after a failure neither re-triggers this workflow nor changes
          # a re-run's payload -- the escape hatch would never clear the check.
          # Failure is loud: a transient 5xx must not masquerade as "unlabelled",
          # which would be unfalsifiable from the log.
          if ! override=$(gh api "repos/$REPO/issues/$PR/labels" --jq 'any(.[].name; . == "oversized-ok")'); then
            echo "::error title=Could not read PR labels::the label API call failed, so the oversized-ok override cannot be evaluated. Re-run this job."
            exit 1
          fi
          echo "oversized-ok present: $override"

          # `git diff --numstat` renders a rename as `dir/{old => new}.ext`,
          # which the $-anchored exclusions would miss; normalise to the new
          # path first so a renamed generated file is still excluded.
          stat=$(git -c core.quotePath=false diff --numstat HEAD^1 HEAD \
            | sed -E 's/\{[^}]* => ([^}]*)\}/\1/g' \
            | grep -vE "$EXCLUDE_RE" || true)
          total=$(printf '%s\n' "$stat" | awk 'NF{a+=$1; d+=$2} END{print a+d+0}')
          echo "Reviewable churn (added+removed, generated/vendored excluded): $total"

          if [ "$total" -le "$LIMIT" ]; then
            echo "::notice title=PR size::$total reviewable lines (limit $LIMIT)"
            exit 0
          fi
          if [ "$override" = "true" ]; then
            echo "::warning title=PR size override::$total reviewable lines exceeds $LIMIT; passing on the oversized-ok label. Review burden accepted explicitly."
            exit 0
          fi
          echo "::error title=PR too large to review properly::$total reviewable lines exceeds the $LIMIT ceiling. Split it, or add the 'oversized-ok' label to accept the review burden deliberately."
          exit 1

  # swift-format style gate. Runs on a Linux container — free/fast, no macOS
  # minutes. The container tag pins the EXACT swift-format version (issue #2:
  # formatter defaults drift across releases and would redden every open PR
  # at once); bump the tag deliberately, reformatting the tree in the same PR.
  lint:
    name: Lint (swift-format)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: swift:6.3.3-rhel-ubi9
    steps:
      - uses: actions/checkout@v6
      - name: Mark workspace safe for git-in-container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Gate = "the formatter was run", verified by running it and requiring a
      # clean diff. Deliberately NOT `swift format lint --strict`: lint-only
      # rules (e.g. EndOfLineComment) flag things `format --in-place` cannot
      # fix, so a strict-lint gate can fail with no runnable remedy — the
      # mlx-swift-lm pre-commit pattern avoids that class entirely.
      - name: swift-format check
        run: |
          swift format --in-place --configuration .swift-format --recursive Sources Tests clients Package.swift
          git diff --exit-code \
            || { echo "::error::Style check failed — run: swift format --in-place --configuration .swift-format --recursive Sources Tests clients Package.swift and commit the diff (shown above)"; exit 1; }

  unit:
    name: Unit tier (swift test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # Toolchain selection, the DEVELOPER_DIR pin, the agreement assertion
      # and the compiler fingerprint live in ONE place (#87). Both jobs call
      # it, so the "these two blocks must stay byte-identical" rule that
      # governed the SPM key is now structural instead of a comment.
      - name: Select Xcode toolchain
        id: toolchain
        uses: ./.github/actions/select-toolchain

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # Fail fast if the download silently didn't take (mlx-swift CI pattern):
      # a missing toolchain otherwise surfaces later as a confusing Metal
      # compile error.
      - name: Verify Metal Toolchain present
        run: xcodebuild -showComponent MetalToolchain

      # Skip the cargo build entirely when rust-shim sources are unchanged
      # (content-hashed cache, mlx setup-linux pattern).
      - name: Cache rust-shim build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-shim/target
          key: ${{ runner.os }}-rust-shim-${{ hashFiles('rust-shim/**') }}

      - name: Build rust-shim (structured-output staticlib)
        run: ./rust-shim/build.sh

      # SPM checkouts + compiled dependency artifacts (mlx-swift, mlx-swift-lm,
      # hummingbird, …) — the bulk of the unit-tier wall clock. Keyed on the
      # exact dependency pins + Xcode version (swiftmodules are not portable
      # across compiler versions); on a dep bump the restore-keys prefix pulls
      # the previous cache and SPM rebuilds only what changed. Athena's own
      # targets recompile every run (their objects ride along but the key
      # ignores source changes — an exact hit skips the save, so the cache is
      # only re-uploaded when the pins or toolchain move). NOTE: PR-created
      # caches are invisible to sibling PRs; the `seed` job on main is what
      # publishes the cache everyone restores.
      #
      # The `-v3-` salt is deliberate — do NOT "clean it up". It has been
      # bumped for two distinct reasons, so "the invariant" is broader than
      # either: (v2, #56) a toolchain-key mismatch, below; (v3, ADR 044 / #93)
      # every v2 entry holds a pre-traits substrate checkout, and SwiftPM
      # validates `traits: []` against the CHECKED-OUT manifest before
      # re-resolving, so a restored stale checkout hard-fails resolution —
      # and stickily, since a failed build never saves a replacement entry.
      # Bump the salt whenever a restored .build can poison resolution or
      # keying, whatever the mechanism. The v2 story (#56): before the
      # DEVELOPER_DIR export landed (840895a3) — it now lives in the
      # `select-toolchain` composite action, `.github/actions/select-toolchain`
      # (#87) — deploy/test.sh's CLT fallback
      # silently re-pointed builds at the runner's DEFAULT Xcode, so the cache
      # entry was KEYED as one toolchain but BUILT by another. Post-fix, SPM
      # sees foreign-compiler swiftmodules and rebuilds everything despite a
      # cache hit — a ~6.5-10.5 min full compile on every PR. The entry cannot
      # self-heal: unit skips the save on an exact hit, and seed's lookup-only
      # probe short-circuits because the key exists. Salting forces one fresh
      # seed build under the pinned toolchain; steady state is self-consistent
      # thereafter, and a runner-image Xcode bump rotates the key naturally.
      #
      # The `steps.toolchain.outputs.fingerprint` component below is
      # LOAD-BEARING, not decoration (#59): it is what makes the key name the
      # compiler rather than the Xcode app. Dropping it from one job only
      # produces a permanent miss; dropping it from both silently restores the
      # pre-#59 shape. The DEVELOPER_DIR assertion inside the composite action
      # is what stops either from happening quietly.
      - name: Cache SPM build
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-v3-${{ steps.toolchain.outputs.xcode-version }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-v3-${{ steps.toolchain.outputs.xcode-version }}-${{ steps.toolchain.outputs.fingerprint }}-

      - name: Unit tests
        run: ./deploy/test.sh

      # CI-debugging breadcrumbs on red runs (mlx-swift-lm pattern): xcresult
      # bundles + macOS crash logs, short retention.
      - name: Upload test results and crash logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-failure-diagnostics
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
            .build/**/*.xcresult
            ~/Library/Logs/DiagnosticReports/*
          retention-days: 7
          if-no-files-found: ignore

  # Post-merge cache seeding, build-only. The unit tier already ran on the PR
  # head; re-running tests on the identical tree post-merge bought nothing at
  # 10x macOS billing. This job's only product is the main-scoped SPM cache —
  # and when the exact key already exists (the common case: no dep-pin or
  # Xcode change), the lookup-only probe short-circuits the whole job.
  seed:
    name: Seed SPM cache (main)
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # Toolchain selection, the DEVELOPER_DIR pin, the agreement assertion
      # and the compiler fingerprint live in ONE place (#87). Both jobs call
      # it, so the "these two blocks must stay byte-identical" rule that
      # governed the SPM key is now structural instead of a comment.
      - name: Select Xcode toolchain
        id: toolchain
        uses: ./.github/actions/select-toolchain

      # All four SPM keys in this job must stay byte-identical to the `unit`
      # job's — seed publishes what unit restores, so a prefix bumped on one
      # side and not the other recreates the permanent-miss loop the salt
      # exists to break. See the salt-history note above the unit job's key.
      #
      # The two toolchain components of that key are now produced by ONE
      # definition (`.github/actions/select-toolchain`, #87), so they cannot
      # drift TEXTUALLY. That is weaker than "cannot drift": the action
      # guarantees both jobs compute the components the same WAY, not that
      # they yield the same VALUE — if `unit` and `seed` ever run on different
      # images the two differ and #56's permanent-miss loop returns with the
      # action in place and no signal. Still hand-maintained per job:
      # `runs-on` (duplicated), the `-v3-` salt, and the `hashFiles` term.
      - name: Check whether the cache already exists
        id: probe
        uses: actions/cache/restore@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-v3-${{ steps.toolchain.outputs.xcode-version }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.resolved') }}
          lookup-only: true

      - name: Download Metal Toolchain
        if: steps.probe.outputs.cache-hit != 'true'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Verify Metal Toolchain present
        if: steps.probe.outputs.cache-hit != 'true'
        run: xcodebuild -showComponent MetalToolchain

      - name: Cache rust-shim build
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-shim/target
          key: ${{ runner.os }}-rust-shim-${{ hashFiles('rust-shim/**') }}

      - name: Build rust-shim (structured-output staticlib)
        if: steps.probe.outputs.cache-hit != 'true'
        run: ./rust-shim/build.sh

      - name: Restore previous SPM cache (partial)
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-v3-${{ steps.toolchain.outputs.xcode-version }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-v3-${{ steps.toolchain.outputs.xcode-version }}-${{ steps.toolchain.outputs.fingerprint }}-

      # Build everything the unit tier builds (tests included) so the cache
      # a PR restores is complete — but execute nothing.
      - name: Build (no test execution)
        if: steps.probe.outputs.cache-hit != 'true'
        run: swift build --build-tests

      - name: Save SPM cache
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-v3-${{ steps.toolchain.outputs.xcode-version }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.resolved') }}
