# PR CI — the unit test tier. Runs on PRs, plus pushes to main (cache seeding —
# see `on:`); the full Release build + heavy model-gated e2e stay manual
# (real models + hardware).
#
# The MLX Metal shaders need the Metal Toolchain, which requires Xcode 26+ — the
# hosted runner's DEFAULT Xcode is too old, so we select the newest installed
# Xcode explicitly (validated on macos-15 during the 2026-07 soak).
name: CI

# PRs + main. A push trigger on PR BRANCHES alongside pull_request double-runs
# every PR head (different concurrency groups), burning macOS minutes — so
# branches without a PR get CI by opening one. The main push trigger is the
# exception, and it's load-bearing: GitHub scopes caches created on a PR to
# that PR, so only a cache saved from main is visible to every PR. The
# post-merge run on main is what seeds the shared SPM dependency cache.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # swift-format style gate. Runs on a Linux container — free/fast, no macOS
  # minutes. The container tag pins the EXACT swift-format version (issue #2:
  # formatter defaults drift across releases and would redden every open PR
  # at once); bump the tag deliberately, reformatting the tree in the same PR.
  lint:
    name: Lint (swift-format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: swift:6.3.3-rhel-ubi9
    steps:
      - uses: actions/checkout@v6
      - name: Mark workspace safe for git-in-container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Gate = "the formatter was run", verified by running it and requiring a
      # clean diff. Deliberately NOT `swift format lint --strict`: lint-only
      # rules (e.g. EndOfLineComment) flag things `format --in-place` cannot
      # fix, so a strict-lint gate can fail with no runnable remedy — the
      # mlx-swift-lm pre-commit pattern avoids that class entirely.
      - name: swift-format check
        run: |
          swift format --in-place --configuration .swift-format --recursive Sources Tests clients Package.swift
          git diff --exit-code \
            || { echo "::error::Style check failed — run: swift format --in-place --configuration .swift-format --recursive Sources Tests clients Package.swift and commit the diff (shown above)"; exit 1; }

  unit:
    name: Unit tier (swift test)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Select newest Xcode (Metal Toolchain needs Xcode 26+)
        id: xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${latest:-/Applications/Xcode.app}/Contents/Developer"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr -d '\n ')" >> "$GITHUB_OUTPUT"

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # Fail fast if the download silently didn't take (mlx-swift CI pattern):
      # a missing toolchain otherwise surfaces later as a confusing Metal
      # compile error.
      - name: Verify Metal Toolchain present
        run: xcodebuild -showComponent MetalToolchain

      # Skip the cargo build entirely when rust-shim sources are unchanged
      # (content-hashed cache, mlx setup-linux pattern).
      - name: Cache rust-shim build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-shim/target
          key: ${{ runner.os }}-rust-shim-${{ hashFiles('rust-shim/**') }}

      - name: Build rust-shim (structured-output staticlib)
        run: ./rust-shim/build.sh

      # SPM checkouts + compiled dependency artifacts (mlx-swift, mlx-swift-lm,
      # hummingbird, …) — the bulk of the unit-tier wall clock. Keyed on the
      # exact dependency pins + Xcode version (swiftmodules are not portable
      # across compiler versions); on a dep bump the restore-keys prefix pulls
      # the previous cache and SPM rebuilds only what changed. Athena's own
      # targets recompile every run (their objects ride along but the key
      # ignores source changes — an exact hit skips the save, so the cache is
      # only re-uploaded when the pins or toolchain move). NOTE: PR-created
      # caches are invisible to sibling PRs; the push-to-main run is what
      # publishes the cache everyone restores.
      - name: Cache SPM build
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ steps.xcode.outputs.version }}-

      - name: Unit tests
        run: ./deploy/test.sh

      # CI-debugging breadcrumbs on red runs (mlx-swift-lm pattern): xcresult
      # bundles + macOS crash logs, short retention.
      - name: Upload test results and crash logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-failure-diagnostics
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
            .build/**/*.xcresult
            ~/Library/Logs/DiagnosticReports/*
          retention-days: 7
          if-no-files-found: ignore
